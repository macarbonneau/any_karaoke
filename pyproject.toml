[project]
name = "any_karaoke"
version = "0.0.1"
description = "A karaoke that let's you play with any mp3 files"
readme = "README.md"
# whisperX requires >=3.10. Allowing 3.9 silently pins the resolver to whisperX 3.3.1,
# which declares torch and torchaudio with no version bounds and resolves to a broken pair.
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Marc-André Carbonneau", email = "marcandre.carbonneau@gmail.com" },
]

# Only what the karaoke player itself needs. The extraction pipeline is heavy
# (torch, demucs, whisperX) and lives in the "extract" extra.
dependencies = [
  "pygame",
  "eyed3",
  "requests",
]

[project.optional-dependencies]
# torch, torchaudio and torchvision are listed explicitly (whisperX pins the versions)
# so the [tool.uv.sources] CUDA index below applies to them. uv only honours sources for
# direct dependencies, not transitive ones.
extract = [
  "demucs",
  "whisperx>=3.8",
  "torch",
  "torchaudio",
  "torchvision",
  "soundfile",
]

[project.scripts]
any-karaoke = "any_karaoke.main:main"
any-karaoke-extract = "any_karaoke.extractor:main"

[dependency-groups]
dev = [
  "pytest",
  "black",
  "flake8",
]

[tool.uv]
default-groups = ["dev"]

# The default PyPI torch wheels are CPU only on Windows, so GPU builds come from the
# PyTorch index. cu128 is the first CUDA version supporting Blackwell (sm_120) cards.
# Change the URL (and re-run `uv lock`) to target a different CUDA version.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
